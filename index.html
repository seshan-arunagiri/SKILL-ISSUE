<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Canvas Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <!-- MENU SCREEN -->
        <div id="menuScreen" class="overlay">
            <h1>Select Difficulty</h1>
            <div class="button-group">
                <button class="menu-btn" data-diff="EASY">Easy</button>
                <button class="menu-btn" data-diff="MEDIUM">Medium</button>
                <button class="menu-btn" data-diff="HARD">Hard</button>
                <button class="menu-btn" data-diff="MASTER">Master</button>
            </div>
        </div>

        <!-- PAUSE SCREEN -->
        <div id="pauseScreen" class="overlay hidden">
            <h1>Paused</h1>
            <p>Esc to resume</p>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameOverScreen" class="overlay hidden">
            <h1>GAME OVER</h1>
            <h2 id="finalScore">Score: 0</h2>
            <h3 id="bestScoreDisplay">Best: 0</h3>
            <div class="button-group">
                <button id="retryBtn" class="menu-btn">Retry Same Level</button>
                <button id="menuBtn" class="menu-btn">Play Again (Menu)</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
